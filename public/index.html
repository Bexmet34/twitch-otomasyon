<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Twitch Drops Takip Paneli</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
    .customer-box { width: 100%; max-width: 450px; text-align: center; }
    .input-group { display: flex; gap: 10px; margin-top: 20px; }
    .input-group input { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.3); color: white; font-size: 1rem; }
    
    .stats-card { background: rgba(20,20,30,0.6); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 20px; margin-top: 30px; text-align: left; display: none; }
    
    .uc-header { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; }
    .uc-avatar { width: 50px; height: 50px; border-radius: 50%; border: 2px solid var(--accent); }
    .uc-name { font-weight: 600; font-size: 1.2rem; }
    .uc-status { font-size: 0.8rem; padding: 4px 10px; border-radius: 20px; background: rgba(255,255,255,0.1); }
    .uc-status.online { background: rgba(0, 255, 128, 0.2); color: #00ff80; }
    
    .uc-stats { display: flex; justify-content: space-between; margin-bottom: 20px; font-size: 0.95rem; }
    .uc-stat-col { display: flex; flex-direction: column; }
    .uc-stat-val { font-family: 'JetBrains Mono', monospace; font-weight: bold; color: var(--accent); margin-top: 5px; }
    
    .uc-progress-bar { width: 100%; height: 8px; background: rgba(0,0,0,0.4); border-radius: 4px; margin-top: 8px; overflow: hidden; }
    .uc-progress-fill { height: 100%; background: var(--accent); transition: width 0.5s ease; }
  </style>
</head>
<body>
  <div class="bg-orbs" aria-hidden="true"><div class="orb orb-1"></div><div class="orb orb-2"></div><div class="orb orb-3"></div></div>

  <div class="customer-box glass" style="padding: 30px; border-radius: 20px;">
    <h2>Twitch Drops Botunuzu Takip Edin</h2>
    <p style="color: var(--text-muted); margin-top: 10px;">İtemSatış üzerinden aldığınız hizmetin durumunu canlı olarak buradan görebilirsiniz.</p>
    
    <div class="input-group">
      <input type="text" id="usernameInput" placeholder="Twitch Kullanıcı Adınız" />
      <button class="btn" id="btnCheck">Durumu Sorgula</button>
    </div>

    <div class="stats-card" id="statsCard">
      <!-- Ajax ile dolacak -->
    </div>
  </div>
  
  <script src="app.js"></script>
</body>
</html>
